version: '3.8'

services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: ../
      dockerfile: .docker/php/Dockerfile
    image: prime-aviation-app
    container_name: prime_aviation_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - ../:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    networks:
      - prime_network
    depends_on:
      - db
      - redis
      - elasticsearch

  # Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: prime_aviation_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - prime_network
    depends_on:
      - app

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: prime_aviation_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prime_aviation}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - prime_network

  # Redis In-Memory Cache & Queue Service
  redis:
    image: redis:alpine
    container_name: prime_aviation_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redisdata:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - prime_network

  # Elasticsearch Search Engine Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: prime_aviation_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./.docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - esdata:/usr/share/elasticsearch/data
    networks:
      - prime_network

  # Queue Worker Service
  worker:
    build:
      context: ../
      dockerfile: .docker/php/Dockerfile
    container_name: prime_aviation_worker
    restart: unless-stopped
    command: php /var/www/html/artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ../:/var/www/html
    networks:
      - prime_network
    depends_on:
      - app
      - redis

networks:
  prime_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  esdata:
    driver: local
