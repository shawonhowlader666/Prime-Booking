<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500&amp;family=Outfit:wght@300;400&amp;display=swap');
      .logo-text {
        font-family: 'Comfortaa', 'Outfit', 'Century Gothic', -apple-system, sans-serif;
        font-weight: 300;
        fill: #ffffff;
        font-size: 50px;
        text-anchor: middle;
        dominant-baseline: alphabetic;
      }
    </style>
  </defs>

  <!-- Top Row: prime -->
  <text x="152" y="78" class="logo-text">p</text>
  <text x="216" y="78" class="logo-text">r</text>
  <text x="280" y="78" class="logo-text">i</text>
  <text x="344" y="78" class="logo-text">m</text>
  <text x="408" y="78" class="logo-text">e</text>

  <!-- Middle Row: 7 Colored Dots -->
  <circle cx="88"  cy="130" r="21" fill="#6A1B9A" />
  <circle cx="152" cy="130" r="21" fill="#1565C0" />
  <circle cx="216" cy="130" r="21" fill="#0095FF" />
  <circle cx="280" cy="130" r="21" fill="#00E676" />
  <circle cx="344" cy="130" r="21" fill="#FFEB3B" />
  <circle cx="408" cy="130" r="21" fill="#FF6D00" />
  <circle cx="472" cy="130" r="21" fill="#FF1744" />

  <!-- Bottom Row: booking -->
  <text x="88"  y="198" class="logo-text">b</text>
  <text x="152" y="198" class="logo-text">o</text>
  <text x="216" y="198" class="logo-text">o</text>
  <text x="280" y="198" class="logo-text">k</text>
  <text x="344" y="198" class="logo-text">i</text>
  <text x="408" y="198" class="logo-text">n</text>
  <text x="472" y="198" class="logo-text">g</text>
</svg>
